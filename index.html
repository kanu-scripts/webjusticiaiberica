const cloudSame=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function cloudMergeValue(base,local,remote,label){

function cloudMergeRecords(base=[],local=[],remote=[],idField='id',label='registro'){
  const key=x=>x?.[idField];let B=new Map(base.map(x=>[key(x),x])),L=new Map(local.map(x=>[key(x),x])),R=new Map(remote.map(x=>[key(x),x]));let result=[];

    if(l===undefined){if(cloudSame(r,b))continue;throw Error('Conflicto por eliminación en '+label+' ('+id+')')}
    if(r===undefined){if(cloudSame(l,b))continue;throw Error('Conflicto por eliminación en '+label+' ('+id+')')}
    result.push(cloudMergeValue(b,l,r,label+' ('+id+')'));
  }

function cloudMergeVault(base,local,remote){
  const out={...remote};let sections=['cases','investigations','documents','evidence','orders','persons','messages'];
  for(let k of sections)out[k]=cloudMergeRecords(base[k]||[],local[k]||[],remote[k]||[],'id',k);
  out.templates=cloudMergeRecords(base.templates||[],local.templates||[],remote.templates||[],'code','plantillas');
  out.settings=cloudMergeValue(base.settings||{},local.settings||{},remote.settings||{},'configuración');
  out.lawNotes={...remote.lawNotes};for(let id of new Set([...Object.keys(base.lawNotes||{}),...Object.keys(local.lawNotes||{}),...Object.keys(remote.lawNotes||{})])){

async function cloudStoreEvidence(id){
  if(cloudFileIds.has(id))return;
  let file=await db('readonly',s=>s.get(id),'filevault');if(!file)return;
  if(file.cipher.byteLength>22*1024*1024)throw Error('Archivo demasiado grande para sincronización. Límite local de 20 MB por evidencia.');
  const cipher=b64(file.cipher),cipherParts={};for(let i=0,j=0;i<cipher.length;i+=400000,j++){cipherParts['p'+String(j).padStart(5,'0')]=cipher.slice(i,i+400000)}

async function cloudRetrieveEvidence(id){
  let remote=(await cloudRequest('files/'+id)).data;

  let fragments=[];for(let i=0;i<remote.partsCount;i++){let val=remote.cipherParts['p'+String(i).padStart(5,'0')];if(!val)throw Error('Archivo incompleto en la nube.');fragments.push(val)}

async function cloudPublish({initial=false}={}){

      const encrypted=await encryptObject(vault);const payload={format:'iberica-justicia-cloud-v1',updated:now(),revision:uid(),by:currentUser?.id||'',users,encryptedVault:encrypted,cloudFiles:[...cloudFileIds]};

async function unlock(user,pass){let k=await derive(pass,user.salt);return bytes(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(user.iv)},k,unb64(user.wrapped)))}

function sideFilter(items){let q=sidebarQuery.toLowerCase();return items.filter(x=>JSON.stringify(x).toLowerCase().includes(q))}
function sidebar(){let config={inicio:['Resumen y accesos rápidos','Resumen de la jornada'],expedientes:['Expedientes judiciales','Buscar por NIG, número o título'],investigaciones:['Atestados y diligencias','Registro de actuaciones'],documentos:['Documentación judicial','Editor de plantillas'],evidencias:['Archivo probatorio','Pruebas y anexos'],ordenes:['Órdenes y mandamientos','Comunicaciones a unidades'],registro:['Personas y condenas','Registro de identidades IC'],leyes:['Biblioteca legislativa','Artículos y resúmenes del BOE'],comunicaciones:['Mensajería interna','Notas y mensajes locales'],usuarios:['Personal autorizado','Cuentas y permisos'],ajustes:['Administración','Personalización y copias']}[currentTab]||['',''];let items=[];let make=(id,name,desc,icon='●')=>`<div class="sideitem ${id===currentRecord?'active':''}" data-action="select" data-id="${es(id)}"><div class="avatar">${icon}</div><div class="info"><strong>${es(name)}</strong><small>${es(desc||'')}</small></div></div>`;
if(currentTab==='expedientes')items=sideFilter(accessibleCases()).map(x=>make(x.id,x.number,x.title,'E'));
if(currentTab==='investigaciones')items=sideFilter(vault.investigations.filter(x=>canAccessCase(caseById(x.caseId)))).map(x=>make(x.id,x.title,casename(x.caseId),'D'));
if(currentTab==='documentos')items=sideFilter(vault.documents.filter(x=>canAccessCase(caseById(x.caseId)))).map(x=>make(x.id,x.title,casename(x.caseId),'§'));
if(currentTab==='evidencias')items=sideFilter(vault.evidence.filter(x=>canAccessCase(caseById(x.caseId)))).map(x=>make(x.id,x.title,casename(x.caseId),'P'));
if(currentTab==='ordenes')items=sideFilter(vault.orders.filter(canAccessOrder)).map(x=>make(x.id,x.title,x.recipientRole==='usuario'?uname(x.recipientUser):ROLES[x.recipientRole]||x.recipientRole,'⚑'));
if(currentTab==='registro')items=sideFilter(vault.persons.filter(canAccessPerson)).map(x=>make(x.id,x.name,x.identifier,'P'));
if(currentTab==='leyes')items=lawList().map(e=>make(e.id,'Art. '+e.article+' · '+e.title,legalSource(e.source).short,'§'));
 if(currentTab==='comunicaciones')items=sideFilter(vault.messages.filter(canReadMsg)).map(x=>make(x.id,x.subject,x.toRole?ROLES[x.toRole]||'General':'General','✉'));
if(currentTab==='usuarios')items=sideFilter(users).map(x=>make(x.id,x.name,ROLES[x.role],x.name.slice(0,1).toUpperCase()));
let add={expedientes:canWriteCase()?'Nuevo expediente':null,investigaciones:'Nueva diligencia',documentos:'Nuevo documento',evidencias:'Añadir evidencia',ordenes:canIssueOrder()?'Nueva orden':null,registro:'Nueva ficha',comunicaciones:'Nuevo mensaje',usuarios:admin()?'Alta de usuario':null};let alabel=add[currentTab];let aux=alabel?`<button class="btn primary full" data-action="new" data-type="${currentTab}">+ ${es(alabel)}</button>`:'';
let search=items.length||['expedientes','investigaciones','documentos','evidencias','ordenes','registro','leyes','comunicaciones','usuarios'].includes(currentTab)?`<div class="searchrow"><input id="sideSearch" type="search" placeholder="Buscar registros..." value="${es(sidebarQuery)}" aria-label="Buscar" autocomplete="off"></div>`:'';
return `<div class="sideTop"><div class="sideHeading">${es(config[0])}</div>${search}${aux}<div class="sideSub">${es(config[1])}</div></div><div class="sideitems" id="sideitems">${items.join('')||`<div style="padding:14px;font-size:13px;color:#8b909e">${['inicio','ajustes'].includes(currentTab)?'Acceso al sistema':'Sin registros'}</div>`}</div><div class="sidefoot">Sistema de rol privado · Guardado en este dispositivo.<br>${es(currentUser.name)} (${es(ROLES[currentUser.role])})</div>`}
function main(){switch(currentTab){case'inicio':return dashboard();case'expedientes':return casesView();case'investigaciones':return investigationsView();case'documentos':return docsView();case'evidencias':return evidenceView();case'ordenes':return ordersView();case'registro':return registryView();case'leyes':return lawsView();case'comunicaciones':return communicationsView();case'usuarios':return usersView();case'ajustes':return settingsView();default:return dashboard()}}
function render(){if(!users.length){$('#app').innerHTML=loginUI('setup');return}if(!currentUser){$('#app').innerHTML=loginUI('login');return}$('#app').innerHTML=shell()}
function loginUI(type){let first=type==='setup';return `<div class="loginarea"><div class="loginbox"><div class="loginhero"><span class="loginseal">⚖</span><h1>IBERICA JUSTICIA</h1><p>Poder Judicial de Ibérica · Aplicación privada de roleplay</p></div><form class="loginform" data-form="${first?'setup':'login'}"><div class="eyebrow">${first?'PRIMER ACCESO · CREAR ADMINISTRADOR':'ACCESO DE PERSONAL AUTORIZADO'}</div>${first?`<div class="formfield"><label>Nombre completo IC</label><input name="name" required autocomplete="name" placeholder="Nombre y apellidos"></div>`:''}<div class="formfield"><label>Usuario</label><input name="username" required autocomplete="username" minlength="3" maxlength="40" placeholder="Identificador de acceso"></div><div class="formfield"><label>Contraseña ${first?'(mínimo 10 caracteres)':''}</label><input type="password" name="password" required ${first?'minlength="10"':''} autocomplete="${first?'new-password':'current-password'}"></div>${first?`<div class="formfield"><label>Confirmar contraseña</label><input type="password" name="confirm" minlength="10" required autocomplete="new-password"></div>`:''}<p class="security">🔒 Archivo de IBERICA PD cifrado en este dispositivo. En modo compartido se sincroniza mediante Firebase y solo acceden cuentas autorizadas. Conserva tu contraseña: sin ella no podrás recuperar la información.</p><button class="btn primary full" type="submit">${first?'Crear sede judicial':'Acceder al sistema'}</button><button class="btn full cloud-login-button" type="button" data-action="cloud-login-modal">☁ Entrar a una sede compartida en otro equipo</button></form><div class="loginfooter">Sistema ficticio IBERICA PD / FivePD · No apto para documentación judicial real</div></div></div>`}
function unreadOrders(){return vault?.orders.filter(o=>canAccessOrder(o)&&!o.ack?.includes(currentUser.id)&&o.issuedBy!==currentUser.id&&o.status==='emitida').length||0}
function dashboard(){let cases=accessibleCases(),orders=vault.orders.filter(canAccessOrder),docs=vault.documents.filter(d=>canAccessCase(caseById(d.caseId))),ev=vault.evidence.filter(d=>canAccessCase(caseById(d.caseId)));return `${header('Panel de control judicial','Centro de trabajo · Situación de los procedimientos, comunicaciones y documentación',btn('＋ Abrir expediente','case-new','primary')+btn('Crear documento','doc-new'))}<div class="statgrid"><div class="stat"><strong>${cases.filter(x=>x.status!=='archivado').length}</strong><span>Expedientes abiertos</span></div><div class="stat"><strong>${orders.filter(x=>x.status==='emitida').length}</strong><span>Órdenes en curso</span></div><div class="stat"><strong>${docs.filter(x=>x.status==='borrador').length}</strong><span>Documentos borrador</span></div><div class="stat"><strong>${ev.length}</strong><span>Evidencias registradas</span></div></div><div class="twocol"><div>${panel('Últimos expedientes',cases.length?`<div class="tablewrap"><table><thead><tr><th>Expediente</th><th>Asunto</th><th>Estado</th></tr></thead><tbody>${cases.slice(0,7).map(c=>`<tr><td><button class="linkbtn" data-action="goto" data-tab="expedientes" data-id="${c.id}">${es(c.number)}</button></td><td>${es(c.title)}</td><td>${statePill(c.status)}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin expedientes','Crea el primer procedimiento para empezar a registrar documentación.','case-new','Crear expediente'))}${panel('Actividad del sistema',`<div class="logbox">${vault.audit.slice(0,6).map(a=>`<div class="logline"><strong>${es(a.name)}</strong> · ${es(a.description)}<br><small>${displayDate(a.at)}</small></div>`).join('')||'<p>Sin actividad registrada.</p>'}</div>`)}</div><div>${panel('Accesos rápidos',`<div class="recordlist">${[['Nuevo atestado','doc-new'],['Registrar actuación policial','investigation-new'],['Adjuntar evidencia','evidence-new'],['Emitir orden judicial','order-new'],['Registrar persona IC','person-new'],['Copia de seguridad','backup']].map(([n,a])=>`<button class="subbtn" data-action="${a}">${es(n)}</button>`).join('')}</div>`)}${panel('Avisos y funcionamiento',`<p style="line-height:1.55;font-size:14px">${unreadOrders()?`Tienes <strong>${unreadOrders()} orden(es)</strong> pendiente(s) de acuse.<br><br>`:''}Esta edición funciona sin internet: cada dispositivo conserva su propio archivo cifrado.</p><p class="warning">Para comunicar órdenes a otros dispositivos hay que exportar e importar copias, o añadir más adelante una sincronización privada.</p>`)}${panel('Personal conectado',`<div class="userchip"><b>●</b>${es(currentUser.name)} · ${es(ROLES[currentUser.role])}</div><p class="foothelp">Identidad y permisos por cuenta. No hay otros usuarios conectados en tiempo real.</p>`)}</div></div>`}
function casesView(){let c=selectedCase();if(c&&canAccessCase(c))return caseDetail(c);let cs=accessibleCases();return `${header('Expedientes judiciales','Registro general de procedimientos del Estado de Ibérica',canWriteCase()?btn('＋ Nuevo expediente','case-new','primary'):'')}${cs.length?`<div class="tablewrap"><table><thead><tr><th>Número</th><th>NIG</th><th>Asunto</th><th>Órgano</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${cs.map(c=>`<tr><td><button class="linkbtn" data-action="goto" data-tab="expedientes" data-id="${c.id}">${es(c.number)}</button></td><td>${es(c.nig)}</td><td>${es(c.title)}</td><td>${es(c.court)}</td><td>${statePill(c.status)}</td><td>${shortDate(c.created)}</td></tr>`).join('')}</tbody></table></div>`:empty('No hay expedientes','Da de alta el primer procedimiento desde el botón de nuevo expediente.',canWriteCase()?'case-new':null,'Crear expediente')}`}
function caseDetail(c){let docs=vault.documents.filter(x=>x.caseId===c.id),ins=vault.investigations.filter(x=>x.caseId===c.id),ev=vault.evidence.filter(x=>x.caseId===c.id),orders=vault.orders.filter(x=>x.caseId===c.id&&canAccessOrder(x));const subtabs=[['resumen','Resumen'],['actuaciones','Diligencias'],['documentos','Documentos'],['pruebas','Evidencias'],['intervinientes','Intervinientes'],['ordenes','Órdenes']];let nav=`<div class="subtabs">${subtabs.map(([t,n])=>`<button class="btn sm ${caseSubview===t?'active':''}" data-action="case-subtab" data-sub="${t}">${n}</button>`).join('')}</div>`;
let body='';if(caseSubview==='resumen')body=`<div class="detailgrid">${mini('Número de expediente',c.number)}${mini('NIG',c.nig)}${mini('Juzgado',c.court)}${mini('Unidad instructora',c.unit)}${mini('Responsable',uname(c.createdBy))}${mini('Apertura',displayDate(c.created))}</div>${panel('Objeto de la causa',`<p style="white-space:pre-wrap;line-height:1.6">${es(c.summary||'Sin descripción')}</p>`)}${panel('Contenido vinculado',`<div class="statgrid"><div class="stat"><strong>${ins.length}</strong><span>Diligencias</span></div><div class="stat"><strong>${docs.length}</strong><span>Documentos</span></div><div class="stat"><strong>${ev.length}</strong><span>Pruebas</span></div><div class="stat"><strong>${orders.length}</strong><span>Órdenes</span></div></div>`)}`;
if(caseSubview==='actuaciones')body=recordItems(ins,'investigaciones',x=>x.title,x=>displayDate(x.created)+' · '+x.type)+btn('＋ Añadir diligencia','investigation-new','primary');
if(caseSubview==='documentos')body=recordItems(docs,'documentos',x=>x.title,x=>x.status+' · '+displayDate(x.created))+btn('＋ Nuevo documento','doc-new','primary');
if(caseSubview==='pruebas')body=recordItems(ev,'evidencias',x=>x.title,x=>x.filename+' · '+x.hash?.slice(0,12))+btn('＋ Adjuntar evidencia','evidence-new','primary');
if(caseSubview==='ordenes')body=recordItems(orders,'ordenes',x=>x.title,x=>x.status+' · '+displayDate(x.created))+(canIssueOrder()?btn('＋ Nueva orden','order-new','primary'):'');
if(caseSubview==='intervinientes')body=`${panel('Personas relacionadas',c.participants?.length?c.participants.map(p=>`<div class="record"><div><strong>${es(p.name)}</strong><div class="desc">${es(p.relation)} · ${es(p.identifier)}</div></div></div>`).join(''):empty('Sin intervinientes','Añade las personas relevantes para el expediente.'))}${canEditCase(c)?btn('＋ Incorporar interviniente','participant-new','primary'):''}${judicial()?panel('Acceso por usuario',`<p class="muted">La cuenta creadora y las personas autorizadas pueden acceder al procedimiento.</p>${users.filter(u=>u.active&&!judicialRole(u.role)).map(u=>`<label style="display:block;margin:9px 0"><input type="checkbox" data-access-user="${u.id}" data-case="${c.id}" ${(c.allowed||[]).includes(u.id)?'checked':''}> ${es(u.name)} (${es(ROLES[u.role])})</label>`).join('')||'No hay cuentas de acceso restringido.'}`):''}`;
return `${header(c.title,`Expediente ${c.number} · ${c.court}`,`${canEditCase(c)?btn('Editar datos','case-edit'):''}${btn('Volver al listado','cases-list','ghost')}`)}<div class="topnote">${statePill(c.status)}<span>Expediente IC · Fecha de alta ${displayDate(c.created)}</span></div><br>${nav}${body}`}
const judicialRole=r=>['admin','juez','fiscal','secretaria'].includes(r);
const recordItems=(arr,tab,getname,getdesc)=>arr.length?`<div class="recordlist" style="margin-bottom:14px">${arr.map(x=>`<div class="record"><div><strong>${es(getname(x))}</strong><div class="desc">${es(getdesc(x))}</div></div><button class="btn sm" data-action="goto" data-tab="${tab}" data-id="${x.id}">Abrir</button></div>`).join('')}</div>`:empty('No hay registros','Añade el primer documento o actuación de este apartado.');
function investigationsView(){let records=vault.investigations.filter(x=>canAccessCase(caseById(x.caseId)));let r=records.find(x=>x.id===currentRecord);if(r)return `${header(r.title,`Investigación / diligencia · ${casename(r.caseId)}`,btn('Editar','investigation-edit')+btn('Volver','investigations-list','ghost'))}<div class="detailgrid">${mini('Tipo',r.type)}${mini('Responsable',r.officer)}${mini('Fecha',displayDate(r.created))}</div>${panel('Descripción de la actuación',`<p style="white-space:pre-wrap;line-height:1.7">${es(r.body)}</p>`)}${panel('Expediente asociado',`<button class="linkbtn" data-action="goto" data-tab="expedientes" data-id="${r.caseId}">${casename(r.caseId)} · ${es(casetitle(r.caseId))}</button>`)}`;
return `${header('Registro de diligencias y atestados','Actuaciones, informes e investigaciones vinculadas a expedientes',btn('＋ Registrar actuación','investigation-new','primary'))}${recordItems(records,'investigaciones',x=>x.title,x=>x.type+' · '+casename(x.caseId))}`}
function docsView(){let records=vault.documents.filter(x=>canAccessCase(caseById(x.caseId)));let d=records.find(x=>x.id===currentRecord);if(d){let tmpl=vault.templates.find(t=>t.code===d.template)||{name:d.template,fields:[]};return `${header(d.title,`${tmpl.name} · ${casename(d.caseId)}`,`${d.status==='borrador'?btn('Editar documento','doc-edit'):''}${btn('Vista imprimible','doc-preview','primary')}${btn('Exportar Word','doc-word')}${canSentence()&&d.status==='borrador'?btn('Validar y bloquear','doc-sign'):''}${btn('Volver','docs-list','ghost')}`)}<div class="detailgrid">${mini('Tipo',tmpl.name)}${mini('Estado',d.status)}${mini('Fecha',displayDate(d.created))}</div>${panel('Contenido del documento',`<div class="docpaper"><div class="docmark">ADMINISTRACIÓN DE JUSTICIA · IBÉRICA</div><h2>${es(d.title)}</h2><p><strong>Referencia:</strong> ${es(casename(d.caseId))}</p>${tmpl.fields.map(t=>{let [title]=t.split('|');return `<h3>${es(title)}</h3><p>${es(d.fields[title]||'Sin cumplimentar')}</p>`}).join('')}</div>`)}`}
return `${header('Documentación judicial','Formularios, resoluciones y actas generados con las plantillas configuradas',btn('＋ Redactar documento','doc-new','primary'))}${panel('Plantillas disponibles',`<div class="splitbtns">${vault.templates.map(t=>`<button class="btn sm" data-action="doc-from-template" data-code="${es(t.code)}">${es(t.name)}</button>`).join('')}</div>`)}${recordItems(records,'documentos',x=>x.title,x=>x.status+' · '+casename(x.caseId))}`}
function evidenceView(){let records=vault.evidence.filter(x=>canAccessCase(caseById(x.caseId)));let e=records.find(x=>x.id===currentRecord);if(e)return `${header(e.title,`Evidencia registrada · ${casename(e.caseId)}`,btn('Ver / descargar archivo','evidence-open','primary')+btn('Registrar traslado','evidence-transfer')+btn('Volver','evidence-list','ghost'))}<div class="detailgrid">${mini('Código',e.code)}${mini('Clase',e.kind)}${mini('Nombre original',e.filename)}${mini('Subido por',uname(e.createdBy))}${mini('Fecha',displayDate(e.created))}${mini('Tamaño',formatSize(e.size))}</div>${panel('Control de integridad',`<p><strong>SHA-256:</strong> <code style="overflow-wrap:anywhere">${es(e.hash)}</code></p><p>${es(e.notes)}</p>`)}${panel('Cadena de custodia',`<div class="logbox">${(e.custody||[]).map(x=>`<div class="logline"><strong>${es(x.by)}</strong> · ${es(x.description)}<br><small>${displayDate(x.at)}</small></div>`).join('')}</div>`)}`;
return `${header('Evidencias y archivos','Fotos, vídeos, audios, informes y anexos probatorios con SHA-256',btn('＋ Adjuntar prueba','evidence-new','primary'))}${recordItems(records,'evidencias',x=>x.title,x=>x.filename+' · '+casename(x.caseId))}`}
function ordersView(){let records=vault.orders.filter(canAccessOrder);let o=records.find(x=>x.id===currentRecord);if(o)return `${header(o.title,`Orden ${o.code} · ${casename(o.caseId)}`,`${!o.ack?.includes(currentUser.id)&&o.issuedBy!==currentUser.id?btn('Acusar recibo','order-ack','primary'):''}${o.status==='emitida'&&canIssueOrder()?btn('Marcar cumplida','order-complete'):''}${btn('Volver','orders-list','ghost')}`)}<div class="detailgrid">${mini('Prioridad',o.priority)}${mini('Estado',o.status)}${mini('Emitida por',uname(o.issuedBy))}${mini('Fecha emisión',displayDate(o.created))}${mini('Dirigida a',o.recipientRole==='usuario'?uname(o.recipientUser):ROLES[o.recipientRole]||o.recipientRole)}${mini('Acuses',String(o.ack?.length||0))}</div>${panel('Texto de la orden',`<p style="white-space:pre-wrap;line-height:1.6">${es(o.body)}</p>`)}${panel('Acuses de recepción',o.ack?.length?o.ack.map(id=>`<div class="logline">✓ ${es(uname(id))}</div>`).join(''):'Sin acuses todavía.')}<div class="warning">Las órdenes solo son visibles dentro de esta misma copia local. No se transmiten a otros dispositivos.</div>`;
return `${header('Órdenes y comunicaciones judiciales','Mandamientos, citaciones, requerimientos y acuses de lectura',canIssueOrder()?btn('＋ Emitir orden','order-new','primary'):'')}${recordItems(records,'ordenes',x=>x.title,x=>x.priority+' · '+x.status)}`}
function canAccessPerson(p){return judicial()||['policia'].includes(currentUser.role)||p.createdBy===currentUser.id}
function registryView(){let records=vault.persons.filter(canAccessPerson);let p=records.find(x=>x.id===currentRecord);if(p)return `${header(p.name,`Identificación IC: ${p.identifier}`,`${canSentence()?btn('＋ Añadir condena','conviction-new','primary'):''}${btn('Editar ficha','person-edit')}${btn('Volver','persons-list','ghost')}`)}<div class="detailgrid">${mini('Nombre',p.name)}${mini('Identificador IC',p.identifier)}${mini('Alias',p.alias)}${mini('Estado',p.status)}${mini('Creada',displayDate(p.created))}${mini('Condenas registradas',String(p.convictions?.length||0))}</div>${panel('Observaciones',`<p style="white-space:pre-wrap">${es(p.notes||'Sin observaciones')}</p>`)}${panel('Sentencias y condenas',p.convictions?.length?p.convictions.map(c=>`<div class="record"><div><strong>${es(c.offence)}</strong><p>${es(c.penalty)}</p><div class="desc">${es(c.state)} · ${casename(c.caseId)} · ${shortDate(c.date)}</div></div>${statePill(c.state)}</div>`).join(''):empty('No constan condenas','Una investigación o denuncia NO equivale a una condena. Solo jueces pueden registrar sentencias.'))}`;
return `${header('Registro de identidades y condenas','Fichas de personas del rol, investigaciones y resoluciones condenatorias',btn('＋ Nueva ficha IC','person-new','primary'))}<p class="hint">La presencia de una persona en este registro no implica culpabilidad. Las condenas se añaden únicamente cuando exista una sentencia en el roleplay.</p><br>${recordItems(records,'registro',x=>x.name,x=>x.identifier+' · '+(x.convictions?.length||0)+' condenas')}`}
function canReadMsg(m){return judicial()||m.by===currentUser.id||m.toRole==='todos'||m.toRole===currentUser.role||m.toUser===currentUser.id}
function communicationsView(){let records=vault.messages.filter(canReadMsg);let m=records.find(x=>x.id===currentRecord);if(m)return `${header(m.subject,'Comunicación interna · '+displayDate(m.created),btn('Volver','messages-list','ghost'))}${panel('Contenido',`<p style="white-space:pre-wrap;line-height:1.8">${es(m.body)}</p><p class="muted">Remitente: ${es(uname(m.by))} · Destinatarios: ${es(m.toRole==='todos'?'Personal autorizado':ROLES[m.toRole]||m.toRole)}</p>`)}`;
return `${header('Comunicaciones internas','Bandeja de avisos, informes breves y notas locales',btn('＋ Nuevo mensaje','message-new','primary'))}<p class="warning">La mensajería es local. Para recibir mensajes en otros dispositivos se necesita sincronización.</p><br>${recordItems(records,'comunicaciones',x=>x.subject,x=>uname(x.by)+' · '+displayDate(x.created))}`}

function settingsView(){return `${header('Configuración de la sede','Personaliza tu sistema sin modificar código HTML',btn('Guardar copia de seguridad','backup','primary'))}${panel('Datos institucionales',`<form data-form="settings" class="formgrid">${input('Nombre de la institución','institution',vault.settings.institution)}${input('Órgano judicial por defecto','court',vault.settings.court)}${input('Municipio','city',vault.settings.city)}${input('Clasificación de documentos','classification',vault.settings.classification)}<div class="formfield wide"><button class="btn primary" type="submit">Guardar configuración</button></div></form>`)}${panel('Plantillas editables',`<p class="muted">Añade o modifica tipos documentales sin tocar código. Un campo por línea: Nombre del campo|texto o Nombre del campo|largo.</p><div class="recordlist">${vault.templates.map(t=>`<div class="record"><div><strong>${es(t.name)}</strong><div class="desc">${es(t.group)} · ${t.fields.length} campos</div></div>${btn('Editar plantilla','template-edit:'+t.code,'sm')}</div>`).join('')}</div><br>${btn('＋ Nueva plantilla','template-new','primary')}`)}${panel('Datos y protección',`<p>Exporta una copia que contiene los datos cifrados, los usuarios y los ficheros adjuntos. Para restaurar necesitas la contraseña de al menos una de las cuentas incluidas.</p><div class="splitbtns">${btn('Exportar copia completa','backup','primary')}${btn('Importar una copia','restore')}${btn('Exportar CSV de expedientes','csv')}${btn('Crear datos de ejemplo','seed')}${btn('Vaciar datos de ejemplo','remove-seed','danger')}</div><p class="warning" style="margin-top:12px"><strong>Importante:</strong> no pierdas la contraseña ni las copias. Los datos se guardan en este navegador; borrarlo o limpiar el almacenamiento del sitio puede eliminarlos.</p>`)}${cloudPanel()}${panel('Limitaciones de esta versión',`<p class="security">Aplicación de simulación para FivePD, no sede judicial real. Los permisos se aplican en la interfaz local, no en un servidor de confianza; por tanto, no constituyen un sistema de autorización fuerte entre usuarios con acceso al mismo dispositivo. Los registros se cifran en reposo con AES-GCM y las contraseñas derivan claves con PBKDF2. En el modo local no hay sincronización automática. En el modo compartido, Firebase verifica las cuentas antes de entregar el archivo cifrado y los datos se actualizan entre dispositivos. El control de visibilidad entre cargos se realiza en la aplicación, no mediante políticas por expediente en el backend; úsalo solo para roleplay ficticio. La sincronización necesita internet y el servicio Firebase administrado.</p>`)}`}

case'conviction-save':if(!canSentence())throw Error('Solo juez / administrador');p=vault.persons.find(x=>x.id===currentRecord);if(!p)throw Error('Ficha no encontrada');requiredCase(f.caseId);p.convictions.unshift({id:uid(),caseId:f.caseId,offence:f.offence,penalty:f.penalty,date:f.date,state:f.state,notes:f.notes,recordedBy:currentUser.id});p.status='Condenado';log('CONDENA','Resolución condenatoria IC: '+p.name);break;
case'message-save':d={id:uid(),subject:f.subject,body:f.body,toRole:f.toRole,by:currentUser.id,created:now()};vault.messages.unshift(d);log('COMUNICACIÓN','Nota enviada en esta instalación local: '+f.subject);currentTab='comunicaciones';currentRecord=d.id;break;
case'user-save':if(!admin())throw Error('Solo administrador');if(users.some(x=>x.username.toLowerCase()===f.username.toLowerCase()))throw Error('Usuario duplicado');if(f.password.length<10)throw Error('Contraseña demasiado corta');let wrap=await wrapRaw(f.password);let firebaseUid=cloudReady()?await cloudCreateUser(f.username.toLowerCase(),f.password,f.role):null;u={id:uid(),name:f.name,username:f.username.toLowerCase(),role:f.role,unit:f.unit,active:true,created:now(),firebaseUid,...wrap};users.push(u);await saveUsers();log('PERSONAL','Usuario creado: '+u.username);currentTab='usuarios';currentRecord=u.id;break;
case'userpass-save':if(!admin())throw Error('Solo administrador');if(f.password!==f.confirm||f.password.length<10)throw Error('Las contraseñas no coinciden o son demasiado cortas');u=users.find(x=>x.id===currentRecord);if(!u)throw Error('No se encontró la cuenta');if(cloudReady())await cloudUpdateOwnPassword(f.password);Object.assign(u,await wrapRaw(f.password));await saveUsers();log('SEGURIDAD','Contraseña actualizada: '+u.username);break;
case'template-save':if(!admin())throw Error('No autorizado');let list=f.fields.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(list.length===0)throw Error('Añade al menos un campo');list=list.map(x=>{let [n,kind]=x.split('|');return n.trim()+'|'+(kind==='largo'?'largo':'texto')});t=vault.templates.find(x=>x.code===f.code);if(t){t.name=f.name;t.group=f.group;t.fields=list}else{t={code:'custom_'+uid().slice(0,8),name:f.name,group:f.group,fields:list};vault.templates.push(t)}log('PLANTILLA','Modelo actualizado: '+t.name);break;
case'settings':if(!admin())throw Error('Solo administrador');Object.assign(vault.settings,f);log('CONFIGURACIÓN','Datos institucionales modificados');break;
case'restore-save':if(!admin())throw Error('Solo administrador');if(f.confirm!=='RESTAURAR')throw Error('Debes escribir RESTAURAR');file=form.querySelector('input[type="file"]')?.files?.[0];if(!file)throw Error('Selecciona el archivo');let decoded=JSON.parse(await file.text());await importBackup(decoded);closeModal();render();toast('Copia restaurada. Inicia sesión con una contraseña de esa copia.');return;
default:throw Error('Formulario no reconocido');
}
closeModal();await done('Registro guardado correctamente')}
function formatSize(size){return size>=1024*1024?(size/1024/1024).toFixed(1)+' MB':(size/1024).toFixed(1)+' KB'}
async function openEvidence(){let e=vault.evidence.find(x=>x.id===currentRecord);if(!e||!canAccessCase(caseById(e.caseId)))throw Error('Sin permiso de lectura');let f=await db('readonly',s=>s.get(e.id),'filevault');if(!f&&cloudReady()){await cloudRetrieveEvidence(e.id);f=await db('readonly',s=>s.get(e.id),'filevault')}if(!f)throw Error('Archivo no disponible. Importa una copia completa o conecta la nube.');let k=await keyForRaw();let clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},k,f.cipher);let hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',clear))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==e.hash)throw Error('Error de integridad SHA-256: el archivo no coincide');let blob=new Blob([clear],{type:f.contentType}),url=URL.createObjectURL(blob);let ext=(e.filename.split('.').pop()||'').toLowerCase(),view='';if(f.contentType.startsWith('image/'))view=`<img alt="${es(e.title)}" src="${url}" style="width:100%;max-height:60vh;object-fit:contain">`;else if(f.contentType.startsWith('video/'))view=`<video src="${url}" controls style="width:100%;max-height:60vh"></video>`;else if(f.contentType.startsWith('audio/'))view=`<audio src="${url}" controls style="width:100%"></audio>`;else if(ext==='pdf')view=`<iframe title="Vista de PDF" src="${url}" style="width:100%;height:65vh;border:0"></iframe>`;else view='<p>Este tipo de archivo no se puede previsualizar en el navegador. Descárgalo.</p>';modal('Visor de evidencia · '+e.code,`<div class="security">Archivo verificado: SHA-256 correcto. ${es(e.filename)} · ${formatSize(e.size)}</div><br>${view}<br><a class="btn primary" href="${url}" download="${es(e.filename)}">Descargar archivo</a>`,null,true);setTimeout(()=>URL.revokeObjectURL(url),120000);log('LECTURA','Acceso a evidencia '+e.code);await saveVault()}
function docHTML(d){let c=caseById(d.caseId),t=vault.templates.find(x=>x.code===d.template),fields=t?.fields||[];return `<article class="docpaper"><div class="docmark">⚖<br>ADMINISTRACIÓN DE JUSTICIA<br>${es(vault.settings.institution)}</div><h2>${es(d.title)}</h2><div class="docmeta"><span><strong>NIG:</strong> ${es(c?.nig||'—')}</span><span><strong>Expediente:</strong> ${es(c?.number||'—')}</span><span><strong>Juzgado:</strong> ${es(c?.court||vault.settings.court)}</span><span><strong>Fecha:</strong> ${shortDate(d.created)}</span></div><p><strong>Referencias:</strong> ${es(d.reference||'')}</p>${fields.map(s=>{let [name]=s.split('|');return `<h3>${es(name)}</h3><p>${es(d.fields?.[name]||'Sin cumplimentar')}</p>`}).join('')}<p style="text-align:right;margin-top:36px">${es(vault.settings.city)}, ${shortDate(d.created)}</p><p style="text-align:right">${es(d.status==='validado'?'Validación interna IC · '+uname(d.signedBy):'Borrador pendiente de validación')}</p><div style="margin-top:25px;border-top:1px solid #bbb;font-size:11px;color:#777;text-align:center;padding:9px">${es(vault.settings.classification)} · SIN VALIDEZ JURÍDICA REAL</div></article>`}
function previewDoc(){let d=vault.documents.find(x=>x.id===currentRecord);if(!d)return;$('#modal').innerHTML=`<div class="modalwrap"><div class="modalbox big"><div class="modalhead noprint"><h2>Vista previa — ${es(d.title)}</h2><button class="close" data-action="close-modal">×</button></div><div class="modalbody">${docHTML(d)}</div><div class="modalfoot noprint">${btn('Imprimir / Guardar como PDF','print','primary')}${btn('Cerrar','close-modal')}</div></div></div>`}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportWord(){let d=vault.documents.find(x=>x.id===currentRecord);if(!d)return;let h=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:'Times New Roman';font-size:12pt}.docpaper{max-width:700px;margin:auto}.docmark,h2{text-align:center}h3{border-bottom:1px solid #999;padding-top:14px}p{white-space:pre-wrap}</style></head><body>${docHTML(d)}</body></html>`;download(new Blob(['\ufeff',h],{type:'application/msword'}),'IBERICA_'+d.title.replace(/[^\wÁÉÍÓÚáéíóúñÑ -]/g,'').replace(/ /g,'_')+'.doc');toast('Documento Word exportado')}
async function exportBackup(){if(!currentUser)throw Error('Necesitas iniciar sesión');await saveVault();let all=await new Promise((resolve,reject)=>{let tx=dbconn.transaction('filevault','readonly'),s=tx.objectStore('filevault');let out=[];s.openCursor().onsuccess=e=>{let c=e.target.result;if(c){out.push([c.key,c.value]);c.continue()}else resolve(out)};tx.onerror=()=>reject(tx.error)});let files=[];for(let [id,f] of all)files.push({id,iv:f.iv,cipher:b64(f.cipher),filename:f.filename,contentType:f.contentType});let backup={format:'iberica-justicia-offline-v1',created:now(),users,encryptedVault:await db('readonly',s=>s.get('vault')),files};download(new Blob([JSON.stringify(backup)],{type:'application/json'}),'IBERICA_JUSTICIA_COPIA_'+new Date().toISOString().slice(0,10)+'.json');toast('Copia cifrada completa exportada')}
async function importBackup(data){if(data.format!=='iberica-justicia-offline-v1'||!Array.isArray(data.users)||!data.encryptedVault?.cipher||!Array.isArray(data.files))throw Error('Copia no reconocida');if(!data.users.length)throw Error('La copia carece de cuentas');await new Promise((resolve,reject)=>{let tx=dbconn.transaction(['kv','filevault'],'readwrite'),kv=tx.objectStore('kv'),fs=tx.objectStore('filevault');kv.put(data.users,'users');kv.put(data.encryptedVault,'vault');fs.clear();for(let f of data.files){fs.put({iv:f.iv,cipher:unb64(f.cipher).buffer,filename:f.filename,contentType:f.contentType},f.id)}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});users=data.users;logout()}
function exportCsv(){let csv='Número;NIG;Título;Órgano;Estado;Alta\r\n'+accessibleCases().map(c=>[c.number,c.nig,c.title,c.court,c.status,c.created].map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'IBERICA_expedientes.csv')}
async function seedData(){if(vault.cases.some(x=>x.demo))throw Error('Ya existen datos de ejemplo');let c1={id:uid(),number:'EXP-2026-0042',nig:'41091-73-10-2026-0000042',title:'Investigación de actuación policial',status:'investigacion',court:'Juzgado de Instrucción n.º 7',unit:'Policía Judicial de Ibérica',summary:'EJEMPLO FICTICIO — Se investigan circunstancias de una intervención y se solicitan declaraciones y pruebas.',createdBy:currentUser.id,created:now(),updated:now(),participants:[{id:uid(),name:'Pablo Moreno',relation:'Investigado',identifier:'IC-1042'},{id:uid(),name:'Lucía Serrano',relation:'Testigo',identifier:'IC-3130'}],allowed:[],demo:true},c2={...structuredClone(c1),id:uid(),number:'EXP-2026-0043',nig:'41091-73-10-2026-0000043',title:'Incidente en instalaciones municipales',summary:'EJEMPLO FICTICIO — Atestado sobre daños a bienes municipales.',status:'abierto',participants:[]};vault.cases.unshift(c1,c2);vault.investigations.unshift({id:uid(),caseId:c1.id,title:'Diligencia de inicio de investigación',type:'Diligencia',officer:currentUser.name,body:'EJEMPLO FICTICIO: apertura de actuaciones y petición de material gráfico.',createdBy:currentUser.id,created:now(),demo:true});vault.orders.unshift({id:uid(),code:'ORD-2026-0001',caseId:c1.id,title:'Solicitud de atestado a unidad policial',kind:'Requerimiento',body:'EJEMPLO FICTICIO: remítase el informe de intervención al juzgado para continuar el expediente.',priority:'Preferente',recipientRole:'policia',issuedBy:currentUser.id,status:'emitida',created:now(),ack:[],demo:true});vault.persons.unshift({id:uid(),name:'Pablo Moreno',identifier:'IC-1042',alias:'',notes:'Ficha ficticia de demostración.',status:'Investigado',created:now(),createdBy:currentUser.id,convictions:[],demo:true});log('DEMOSTRACIÓN','Registros ficticios añadidos');await done('Datos de ejemplo creados')}
async function removeSeed(){let demoIds=new Set(vault.cases.filter(x=>x.demo).map(x=>x.id));vault.cases=vault.cases.filter(x=>!x.demo);vault.investigations=vault.investigations.filter(x=>!x.demo&&!demoIds.has(x.caseId));vault.orders=vault.orders.filter(x=>!x.demo&&!demoIds.has(x.caseId));vault.persons=vault.persons.filter(x=>!x.demo);vault.documents=vault.documents.filter(x=>!demoIds.has(x.caseId));let deleted=vault.evidence.filter(x=>demoIds.has(x.caseId));vault.evidence=vault.evidence.filter(x=>!demoIds.has(x.caseId));for(let e of deleted)await db('readwrite',s=>s.delete(e.id),'filevault');log('DEMOSTRACIÓN','Datos ficticios eliminados');await done('Ejemplos eliminados')}
async function clickAction(el){const action=el.dataset.action,id=el.dataset.id;switch(action){case'tab':navTab(el.dataset.tab);return;case'cloud-login-modal':cloudModal('cloud-login-modal');return;case'cloud-config':if(!admin())throw Error('Solo administración');cloudModal('cloud-config');return;case'cloud-reconnect':cloudModal('cloud-reconnect');return;case'cloud-sync':if(!cloudReady())throw Error('Inicia sesión en la nube');await cloudPublish();render();toast('Nube sincronizada correctamente');return;case'cloud-pull':await cloudResetAndPull();return;case'cloud-disconnect':cloudDisconnect();return;case'law-filter':lawFilter=id;currentRecord=null;sidebarQuery='';render();return;case'law-select':currentTab='leyes';currentRecord=id;render();return;case'law-back':currentRecord=null;render();return;case'law-copy':{let law=LAW_ENTRIES.find(e=>e.id===currentRecord);if(!law)return;let reference=lawCitation(law);try{await navigator.clipboard.writeText(reference);toast('Referencia copiada al portapapeles')}catch{modal('Copiar referencia',`<textarea readonly style="width:100%;min-height:100px">${es(reference)}</textarea>`)}return;}case'goto':currentTab=el.dataset.tab;currentRecord=id;render();return;case'select':currentRecord=id;render();return;case'case-subtab':caseSubview=el.dataset.sub;render();return;case'close-modal':closeModal();return;case'logout':logout();return;case'cases-list':currentRecord=null;render();return;case'investigations-list':case'docs-list':case'evidence-list':case'orders-list':case'persons-list':case'messages-list':case'users-list':currentRecord=null;render();return;case'new':showModal(({expedientes:'case-new',investigaciones:'investigation-new',documentos:'doc-new',evidencias:'evidence-new',ordenes:'order-new',registro:'person-new',comunicaciones:'message-new',usuarios:'user-new'})[el.dataset.type]);return;case'doc-from-template':currentTemplate=el.dataset.code;showModal('doc-new');return;case'order-ack':{let o=vault.orders.find(x=>x.id===currentRecord);if(!canAccessOrder(o))throw Error('Sin acceso');if(!o.ack.includes(currentUser.id))o.ack.push(currentUser.id);log('ACUSE','Orden '+o.code+' recibida por '+currentUser.name);await done('Recepción registrada');return}case'order-complete':{let o=vault.orders.find(x=>x.id===currentRecord);if(!canIssueOrder())throw Error('Sin permiso');o.status='cumplida';log('ORDEN','Cumplida: '+o.code);await done('Orden marcada cumplida');return}case'doc-sign':{let d=vault.documents.find(x=>x.id===currentRecord);if(!canSentence()||d?.status!=='borrador')throw Error('No se puede validar');if(!confirm('Se bloqueará el documento para impedir ediciones posteriores. ¿Continuar?'))return;d.status='validado';d.signedBy=currentUser.id;d.signedAt=now();log('DOCUMENTO','Documento validado IC: '+d.title);await done('Documento validado (sin firma electrónica certificada)');return}case'doc-preview':previewDoc();return;case'doc-word':exportWord();return;case'print':window.print();return;case'evidence-open':await openEvidence();return;case'backup':await exportBackup();return;case'csv':exportCsv();return;case'users-list':currentRecord=null;render();return;case'user-toggle':{if(!admin())throw Error('No autorizado');let u=users.find(x=>x.id===currentRecord);if(u.id===currentUser.id)throw Error('No puedes desactivar tu propia sesión');u.active=!u.active;if(cloudReady()&&u.firebaseUid){try{await cloudRequest('members/'+u.firebaseUid,'PUT',{active:u.active,role:u.role,email:u.username,updated:now()})}catch(err){u.active=!u.active;throw err}}await saveUsers();log('USUARIO','Cuenta '+u.username+' = '+(u.active?'activa':'baja'));await done('Estado actualizado');return}case'seed':if(!admin())throw Error('No autorizado');await seedData();return;case'remove-seed':if(!admin())throw Error('No autorizado');if(confirm('¿Eliminar los datos de ejemplo?'))await removeSeed();return;default:if(action?.startsWith('template-edit:')){currentTemplate=action.split(':')[1];showModal('template-edit');return}if(['case-new','case-edit','participant-new','investigation-new','investigation-edit','doc-new','doc-edit','evidence-new','evidence-transfer','order-new','person-new','person-edit','conviction-new','message-new','user-new','user-pass','template-new','restore','law-note'].includes(action)){if(action==='doc-new')currentTemplate=null;showModal(action);return}}}

async function onTemplateChange(sel){let c=$('#modal form [name="caseId"]')?.value||'',title=$('#modal form [name="title"]')?.value||'';currentTemplate=sel.value;closeModal();showModal('doc-new');let f=$('#modal form');if(f){if(c)f.querySelector('[name="caseId"]').value=c;if(title&&!vault.templates.some(t=>t.name===title))f.querySelector('[name="title"]').value=title}}
document.addEventListener('click',async event=>{let b=event.target.closest('[data-action]');if(!b)return;event.preventDefault();try{await clickAction(b)}catch(err){toast('Error: '+(err.message||err))}});
document.addEventListener('change',async event=>{let el=event.target;if(el.dataset.accessUser){let c=caseById(el.dataset.case);if(!judicial()||!c)return;let set=new Set(c.allowed||[]);el.checked?set.add(el.dataset.accessUser):set.delete(el.dataset.accessUser);c.allowed=[...set];log('PERMISOS','Cambio de acceso para expediente '+c.number);await saveVault();toast('Acceso actualizado')}if(el.name==='template'&&el.closest('[data-form="doc-save"]')&&!el.closest('[data-form="doc-save"]').querySelector('[name="id"]').value){onTemplateChange(el)}});
document.addEventListener('input',event=>{if(event.target.id==='sideSearch'){sidebarQuery=event.target.value;let c=event.target.selectionStart;let old=document.querySelector('.sideitems');let node=document.createElement('div');node.innerHTML=sidebar();let next=node.querySelector('.sideitems');if(old&&next)old.innerHTML=next.innerHTML;if(currentTab==='leyes'&&!currentRecord){let content=document.querySelector('.content');if(content)content.innerHTML=main()}}});
document.addEventListener('submit',async event=>{let form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();let btn=form.querySelector('button[type="submit"]');if(btn)btn.disabled=true;try{await formSubmit(form.dataset.form,form)}catch(err){toast('Error: '+(err.message||err));console.error(err)}finally{if(btn?.isConnected)btn.disabled=false}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(async()=>{try{if(!globalThis.indexedDB||!globalThis.crypto?.subtle)throw Error('El navegador no permite guardar y cifrar los datos. Abre el archivo con Chrome o Edge actualizado.');await dbopen();render()}catch(err){document.getElementById('app').innerHTML=`<div class="loginarea"><div class="loginbox"><div class="loginhero"><h1>IBERICA JUSTICIA</h1></div><div class="modalbody"><p class="warning">${es(err.message)}</p></div></div></div>`}})();
